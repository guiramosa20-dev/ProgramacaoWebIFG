<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Tags específicas html 5</title>
    <style>
        body{
            margin: 0px;
        }
        header{
            position: static;
            margin: 0px;
            padding: 50px;
            top:0px;
            left: 50%;
            text-align: center;
            justify-content: center;
            background-color: rgb(142, 192, 236);
            color: antiquewhite;

        }
        .menu{
            position: relative;
            padding: 10px;
            display: flex;
            flex-direction: row;
            justify-content: center;
            background-color: wheat;
        }
        .container{
            height: auto;
            padding: 50px;
            display:flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 20px
        }
        .card{
            width: 200px;
            height: 150px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid brown;
            box-shadow: 10px 10px 10px wheat;
            border-radius: 10px;
        }
        .footer{
            position:fixed;
            bottom: 0px;
            padding: auto;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 80px;
            background-color: #0c0f39;
            color: whitesmoke;
        }
        a{
            margin: 20px;
            text-align: center;
            width: 25%;
            border-radius: 5px;
        }


    </style>
</head>
<body>
    <header>
        <h1>Meu Site</h1>
    </header>    
    <nav class="menu">
        <a href="#" style="background-color: #d9d487;">Home</a>
        <a href="#" style="background-color: #b8860b;">Produtos</a>
        <a href="#" style="background-color: #f08080;">Sobre</a>
        <a href="#" style="background-color: #20b2aa;">Contato</a>
    </nav>
    <main class="container">
        <div class="card">Card 1</div>
        <div class="card">Card 2</div>
        <div class="card">Card 3</div>
    </main>
    <footer class="footer">
        Rodapé
    </footer>
</body>
</html>
