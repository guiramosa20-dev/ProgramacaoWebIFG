            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;

        #fundo{
            width: 940px;
            height: 460px;
            background-color: #A05E2A;
            border-radius: 25px;
            position:relative;

            display: flex;
            justify-content: flex-start;
            align-items: flex-start;

        #topo{
            margin-left: 49px;
            margin-top: 50px;
            width: 842px;
            height: 360px;
            background-color: green;
            /*border-radius: 25px;*/
            /*box-shadow: inset 10px 10px rgb(10, 104, 10),
             inset -10px -10px rgb(10, 104, 10);*/
            position: relative;

            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
        }
        #furo{
            margin-left: -1px;
            height: 50px;
            width: 50px;
            background-color: black;
            border-radius: 30px;
            position: absolute;
            /*border: solid 5px rgb(101, 155, 1);*/
            transform: translate(-50%,-50%);
            /*box-shadow: 5px 9px green;*/
        }
        #borda-furo{
            position: absolute;
            width: 60px;
            height: 60px;
            background-color: #DFAD4E;
            border-radius: 30px;
            margin-left: 48px;
            margin-top: 50px;
            transform: translate(-50%,-50%);
        }
        #borda-superior{
            position: absolute;
            width: 360px;
            height: 25px;
            background-color: darkgreen;
            
            /* Arredonda os cantos principais */
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            margin-top: 0px;
            margin-left: 29px;
            margin-right: 20px;
        }
        #borda-inferior{
            position: absolute;
            width: 360px;
            height: 25px;
            background-color: darkgreen;
            
            /* Arredonda os cantos principais */
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
            margin-top: 335px;
            margin-left: 29px;
            margin-right: 20px;

        }
        #borda-lateral{
            position: absolute;
            width: 25px;
            height: 300px;
            background-color: darkgreen;
            
            /* Arredonda os cantos principais */
            border-top-right-radius: 30px;
            border-bottom-right-radius: 30px;
            margin-top: 30px;
            margin-left: 0px;
        }
        /*DIV das bolas UUUI*/
        #bola-branca{
            width: 30px;
            height: 30px;
            background-color: white;
            border-radius: 100px;

            position: absolute;
            transform: translate(-50%);
            margin-top:170px;
            margin-left: 500px;
            box-shadow: inset 2px 2px 5px;
            animation: bola-branca 3s;
            animation-delay: 0.8s;
            animation-timing-function: linear;
            animation-fill-mode: forwards;
        }
        #bola-jogo{
            width: 30px;
            height: 30px;
            background-color: white;
            border-radius: 100px;

            position: absolute;
            transform: translate(-50%);
            margin-top:175px;
            margin-left: 620px;
            box-shadow: inset 2px 2px 5px;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #taco{
            width: 390px;
            height: 5px;
            background-color: black;
            position: absolute;
            margin-left: 150px;
            margin-top: 180px;
            transform: perspective(250px) rotateY(50deg);
            border-bottom-left-radius: 5px;
            border-top-left-radius: 5px;
            border-bottom-right-radius: 5px;
            border-top-right-radius: 5px;
            background-image: linear-gradient(to right, red 0% 0.5%, brown 0.2% 25%, rgb(187, 101, 21) 25% 70%, white 70% 97%, black 97% 100%);
            animation: taco 3s;
            animation-fill-mode: forwards;
        }
        #textura_bola1{

            height: 15px;
            background-color: white;
            border-radius: 100px;
            transform: rotate(90deg);
            text-align: center;

            font-weight: bold;

        }
        #listra_interior{

            height: 18px;
            border-radius: 100px;
            background-color: white;
            position: absolute;
