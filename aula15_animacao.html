<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <style>
body {
  margin: 0;
  height: 100vh;
  overflow: hidden; /* Evita barras de rolagem */
  background-color: #2c3e50;
}

.bola {
  width: 50px;
  height: 50px;
  background-color: #f1c40f;
  border-radius: 50%;
  position: fixed;
  
  /* Nome | Duração | Ritmo | Repetição */
  animation: contornar 6s linear infinite;
  
}
.quadrado{
    width: 50px;
    height: 50px;
    background-color: red;
    position: fixed;
    animation: quicar 6s linear infinite;
}
@keyframes contornar {
  0%, 100% {
    top: 0;
    left: 0;
  }
  25% {
    top: 0;
    left: calc(100% - 50px); /* Move para a direita */
  }
  50% {
    top: calc(100% - 50px); /* Desce para o canto inferior */
    left: calc(100% - 50px);
  }
  75% {
    top: calc(100% - 50px); /* Move para a esquerda */
    left: 0;
  }
}
@keyframes quicar{
    from,to{top: 50%;left:50%;}
    50%{top: calc(100% - 50px);left:50%;}
}
  </style>
</head>
<body>
    <div class="bola"></div>
    <div class="bola" style="animation-delay: 5s; left:50px"></div>
    <div class="bola" style="animation-delay: 2s; left:40px"></div>
    <div class="bola" style="animation-delay: 1s; left: 100px"></div>
    <div class="bola" style="animation-delay: 0.5s; left:200px"></div>
    
    
    <div class="quadrado"></div>
    <div class="quadrado" style="animation-delay: 5s;"></div>
    <div class="quadrado" style="animation-delay: 4s;"></div>
    <div class="quadrado" style="animation-delay: 3s;"></div>
    <div class="quadrado" style="animation-delay: 2s;"></div>
</body>
