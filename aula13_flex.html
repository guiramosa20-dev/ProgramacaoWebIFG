<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    
    <title>aplicação do Flex</title>

    <style>
        *{
            font-family: arial;
        }
        header{
            color: white;
            background-color: black;
            
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            flex-direction: row;
            padding: 10px;
            margin-bottom: 10px;
        }
        .produtos{
            width: auto;
            display:flex;
            flex-wrap: wrap;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            
        }
        .card{
            height: 100px;
            width: 90px;
            padding: 100px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background-color: white;
            margin: 10px;
            margin-bottom: 30px;
            box-shadow: 20px 20px 20px gray;
        
        }
        .card:hover{
            background-image: linear-gradient(blue,black);
            color:aquamarine;
            width: 120px;
            height: 120px
        }
        a{
            color:white;
            text-decoration: none;
            position: relative;
            right: 0px;
            padding: 10px;
            margin-top: 50px;
        }
        nav{
            position: static;
            right: 0px;
        }
        img{
            width: 100px;
            height: 100px;
        }
        h2{
            color:green;
            font-size: 18px;
            
        }
        button{
            background-color: rgb(7, 120, 158);
            color: white;
            height: 100px;
            box-shadow: 5px 5px black;
        }
        button:hover{
            background-color: black;
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }
        button:focus{
            box-shadow: 0px 0px;
        }
        footer{
            background-color: black;
            color: white;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body style="margin: 0px; background-color: rgb(214, 205, 205);">
    <header>

        <nav>
