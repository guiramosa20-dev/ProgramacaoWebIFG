<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <title>Formulários</title>
    <style>
        #clique:hover{
            cursor: pointer;
        }
        label{
            font-family: Arial;
            padding:4px
        }
        input[type='text']{
            width:80%;
            background-color: bisque;
            font-size: 20px;
            padding: 5px;
            border-radius: 100px;
        }
        input[type='text']:hover{
            background-color: burlywood;
            box-shadow: 5px 5px 10px grey;
            width: 100%;
        }
        input[type='password']:focus{
            background-color: aliceblue;
            border-color: blue;
        }
        input[type='submit']{
            width: 100%;
            padding: 10px;
        }
        input[type='submit']:hover{
            cursor: pointer;
            background-color: black;
            color: white
        }
    </style>
</head>
<body>
    <fieldset style="padding: 20px">
        <legend>Formulario de Cadastro</legend>
        <form action="" method="get">

            <p>
                <label for="uf">Estados</label><br>
                <select name="uf">
                  <optgroup label="NORTE">
                    <option value="AC">Acre</option>
                    <option value="AM">Amazonas</option>
                  </optgroup>
                  <optgroup label="CENTRO-OESTE">
                    <option value="GO" selected>Goiás</option>
                    <option value="MT">Mato Grosso</option> 
                    <option value="DF">Distrito Federal</option>
                  </optgroup>
                </select>
            </p>
            <p>
                <label for="datalist">Opções de Carro</label>
            </p>
            <p><label for="nome">Digite seu nome:<br></label>
                <input type="text" name="nome" required>
                </p>
            <p><label for="senha">Digite sua senha:<br></label>
                <input type="password" name="senha">
                </p>
            <p><label for="endereco">Digite sua endereço:<br></label>
                <input type="text" name="endereco" placeholder="Digite seu endereço">
                </p>
            <p><label for="hora">Horário:<br></label>
                <input type="time" name="hora">
                </p>
            <p><label for="data">Data:<br></label>
                <input type="date" name="data">
                </p>
            <p><label for="num">Número:<br></label>
                <input type="number" name="num" min="0" max="20" step="4">
                </p>
            <p><label for="telefone">Telefone:<br></label>
                <input type="tel" name="telefone">
                </p>
            <p><label for="email">Email:<br></label>
                <input type="email" name="email">
                </p>
            <p><label for="vol">volume:<br></label>
                <input type="range" name="vol">
                </p>
            <p><label for="cor">Cor:<br></label>
                <input id="clique" type="color" name="cor">
                </p>
            <p><label for="url">URL:<br></label>
                <input type="url" name="url">
                </p>
            <p><label for="semana">Semana:<br></label>
                <input type="Week" type="semana">
                </p>
            <p><label for="mes">Mês:<br></label>
                <input type="month" type="mes">
                </p>
            <p><label for="pesquisa">Pesquisar:<br></label>
                <input type="search" type="pesquisa">
                </p>
            <p><label for="msg">Mensagem:<br></label>
                <textarea name="msg" id="" cols="30" rows="10"></textarea>
                </p>
            <p>
                <label for="s">Sexo:<br></label>
                <input type="radio" name="s">Masculino <br>
                <input type="radio" name="s">Feminino
            </p>
            <p>
                <label for="m">Matéria:<br></label>
                <input type="checkbox" name="m">Matemática <br>
                <input type="checkbox" name="m">Português <br>
                <input type="checkbox" name="m">Inglês
            </p>
            <p>
                <input id="clique" type="submit" value="Cadastrar" name="btn">
            </p>
        </form>
    </fieldset>
</body>
</html>
