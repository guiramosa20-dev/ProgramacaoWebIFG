<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <style>
        body{
            animation-name: ex2;
            animation-duration: 1s;
            animation-iteration-count: infinite;
        }
        div{
            width: 100px;
            height: 100px;
            display: flex;
            color: white;
            padding: 20px;
            justify-content: center;
            box-sizing: border-box;
            align-items: center;
            animation-name: ex1;
            animation-duration: 0.1s;
            animation-iteration-count: infinite;
        }
        #coracao{
            margin-top: 200px;
            margin-left: 200px;
            width: 100px;
            height: 100px;
            background-image: url("https://th.bing.com/th/id/OIP.UYawnpXd-22DUmtykKuoWwHaGe?w=213&h=186&c=7&r=0&o=5&pid=1.7");

        }
        button{
            margin-top: 20px;
            width: 100px;
            height: 100px;
            border-radius: 5px;
            transition: width 1s, height 1s, background-color 1s, box-shadow 1s, border-radius 1s;
            transition-timing-function: ease-out;
        }
        button:hover{
            transition: 2s;
            width: 220px;
            height: 220;
            background-image: linear-gradient(to left,blue,gold);
            box-shadow: 50px 50px 10px;
            
        }
        @keyframes ex1{
            0%{background-color: brown;}
            25%{background-color: green; border-radius: 10%;;}
            50%{background-color: purple; border-radius: 300%; width: 200px; height:200px; font-size: 40px;}
            75%{background-color: navy; border-radius: 100%;}
            to{background-color: gold; border-radius: 1000%;}
        }
        @keyframes ex2{
         from{background-color:red}
         50%{background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRAZGT1w6uzcz--6jrCHrP65EGDEtt6v7f-5w&s);background-repeat: no-repeat; background-size: cover;}
         to{background-color: blue}
        }
    </style>
</head>
<body style="animation-name: ex2;animation-duration: 0.00000001; animation-iteration-count: infinite;">
    <div>Paerabéns Danilo</div>
    <button>Clique aqui</button>
    <div id="coracao"><img src="https://th.bing.com/th/id/OIP.UYawnpXd-22DUmtykKuoWwHaGe?w=213&h=186&c=7&r=0&o=5&pid=1.7" alt="width:100px; height:100px"></div>
    
</body>
</html>
