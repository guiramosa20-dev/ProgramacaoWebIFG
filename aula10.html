<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <title>Atividade position</title>
    <style>
        div{
            width:100px;
            height:100px;
            position:absolute;
            color: white;
            padding:10px
        }
        #cima_esquerda{
            background-color: red;
            top:0;
            left:0;
        }
        #cima_direita{
            background-color: yellow;
            top:0px;
            right:0px
        }
        #baixo_esquerda{
            background-color: green;
            bottom: 0px;
            left: 0px;
        }
        #baixo_direita{
            background-color: blue;
            bottom: 0px;
            right:0px;
        }
    </style>
</head>
<body>
    <div id="cima_esquerda">Esquerda em cima</div>
    <div id="cima_direita" style="color:blue">Direita em cima</div>
    <div id="baixo_esquerda">Esquerda em baixo</div>
    <div id="baixo_direita">Direita em baixo</div>
</body>
</html>
