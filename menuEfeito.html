<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;/*Obedece o elemento pai (isto é, o elemento que tá dentro de outro)*/
        }
        nav{
            background: linear-gradient(135deg,red,yellow,green);
            padding: 10px 0;
        }
        nav ul{
            display: flex;
            justify-content: center;
            list-style: none;
            flex-wrap: wrap;
        }
        nav li{
            margin: 0 45px
        }
        nav a{
            display: block;
            padding: 12px;
            font-size: 20px;
            font-family: Impact;
            color: rgb(158, 7, 57);
            text-decoration: none;
            border-radius: 5px;
            transition: all 0.3s;
        }
        nav a:hover{
            background-color: navy;
            transform: translateY(-12px)
        }
        @media (max-width: 699px){
            nav{
                width: 100%;
            }
            nav ul{
            display: flex;
            flex-direction: column;
            justify-content: center;
            list-style: none;
            flex-wrap: wrap;
        }
        nav li{
            margin: 0 45px;
        }
        nav a{
            display: block;
            padding-left: 0px;
            font-size: 20px;
            font-family: Verdana;
            text-align: center;
            color: rgb(158, 7, 57);
            text-decoration: none;
            border-radius: 5px;
            transition: all 0.3s;
        }
        }
    </style>
</head>
<body style="background-image: url();">
    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Sobre</a></li>
            <li><a href="#">Serviço</a></li>
            <li><a href="#">Contato</a></li>
            <li><a href="#">Vendas</a></li>
            <li><a href="#">FAQs</a></li>
        </ul>
    </nav>
</body>
</html>
